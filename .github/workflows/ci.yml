name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # `//go:embed all:dist` needs at least one file to exist. The real
      # frontend build isn't needed to vet or test the Go code, and
      # backend/internal/web/dist/.gitkeep is committed for exactly this, so
      # a checkout is enough to satisfy the directive.
      - name: go build
        working-directory: backend
        run: go build ./...

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # -race catches data races in the notification goroutines spawned by the
      # HTTP handlers; it needs cgo, which the runner has by default.
      - name: go test
        working-directory: backend
        run: go test -race ./...

  frontend:
    name: Frontend (check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run check

      # svelte-check does not compile the app, so a build-only failure (a bad
      # Tailwind class, a Vite/plugin problem) would otherwise reach main.
      - name: Build
        working-directory: frontend
        run: npm run build
